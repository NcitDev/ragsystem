name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e . --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Tests (including retrieval regression e2e)
        env:
          # The e2e suite indexes a synthetic repo with a deterministic fake
          # embedder and asserts golden queries rank the right files — the
          # retrieval-recall canary for chunker/scoring changes.
          RAG_E2E: "1"
          RAG_SKIP_GRAPH: "1"
        run: uv run pytest -q
