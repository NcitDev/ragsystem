[server]
host = "127.0.0.1"
port = 7890

[embeddings]
model = "Qwen/Qwen3-Embedding-4B"
# `provider` is deprecated and ignored at runtime — Ollama is the only
# supported embedder after FastEmbed was removed. Field retained for
# user-config back-compat.
provider = "ollama"
dim = 2560
batch_size = 64
keep_alive = "30m"

[reranker]
model = "dengcao/Qwen3-Reranker-4B:Q8_0"
# Deprecated and ignored at runtime — reranker was removed.
enabled = false
top_k = 5

[qdrant]
mode = "server"
url = "http://127.0.0.1:6333"
path = "~/.rag/qdrant_data"
code_collection = "code_chunks"
docs_collection = "doc_chunks"

[index]
max_chunk_chars = 8000
retrieval_top_k = 20
skip_dirs = [".git", "node_modules", ".venv", "venv", "__pycache__", "build", "dist", ".tox", ".mypy_cache", ".ruff_cache"]

[llm]
ollama_url = "http://localhost:11434"
agent_model = "qwen3:8b"
# Generation model for /ask (RAG answer synthesis). Falls back to agent_model.
# gen_model = "qwen3:8b"

[lsp]
enabled = true
auto_detect = true
timeout = 5000

[retrieval_agent]
# LLM provider for the search strategy planner.
# Options: gemini, openai, anthropic, ollama, agy
# `agy` shells out to the Antigravity CLI (subscription auth, no API key) and
# avoids the Gemini public-API 503s. The direct `gemini` provider is kept as a
# fallback option (set provider="gemini", model="gemini-2.5-flash" + GEMINI_API_KEY).
provider = "agy"
# For agy: a CLI display-name model (see `agy models`). "High" reasoning infers
# real symbol names more reliably (fewer hallucinations) at higher latency;
# "Low" is faster and fine for plain query planning.
model = "Gemini 3.5 Flash (High)"
# Environment variable that holds the API key (used only by gemini/openai/anthropic).
api_key_env = "GEMINI_API_KEY"
# For ollama, set provider="ollama" and point base_url at your daemon:
# provider = "ollama"
# model = "qwen3:8b"
# base_url = "http://localhost:11434"
base_url = ""
