[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag"
version = "0.1.0"
description = "Standalone RAG system with TUI dashboard for code search"
requires-python = ">=3.13"
dependencies = [
    # TUI + CLI
    "textual>=1.0.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    # API server
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    # Data validation + config
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Vector store
    "qdrant-client>=1.13.0",
    # Embeddings + reranking
    "fastembed>=0.5.0",
    "httpx>=0.27.0",
    # Code parsing
    "tree-sitter>=0.24.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-kotlin>=0.1.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    # Agent framework
    "agno>=1.0.0",
    "ollama>=0.4.0",
    "openai>=1.0.0",
    # Storage
    "aiosqlite>=0.20.0",
    # Logging
    "structlog>=24.0.0",
    # Plugin config parsing
    "pyyaml>=6.0",
    # Code knowledge graph
    "networkx>=3.0",
]

[project.scripts]
rag = "rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
