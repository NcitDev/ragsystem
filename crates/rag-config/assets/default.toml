[server]
host = "127.0.0.1"
port = 7890
# Serve the browser dashboard at `GET /`. That page cannot be authenticated
# (a browser has no way to send a bearer token on its first request), so it
# embeds a per-process credential that any local process able to reach the
# loopback port can read. Fine on a single-user machine; set false on a shared
# host and reach the daemon over an SSH tunnel with the CLI instead.
dashboard = true

[embeddings]
# MUST be a tag that `ollama list` prints — not a HuggingFace repo path.
# The availability probe takes the segment after the last `/`, lowercases it,
# and requires it as a substring of a served tag, so a HF-style name such as
# "Qwen/Qwen3-Embedding-4B" matches nothing and `/health` reports
# `ollama: unavailable` even while Ollama is running perfectly.
#   ollama pull qwen3-embedding
model = "qwen3-embedding:latest"
# `provider` is deprecated and ignored at runtime — Ollama is the only
# supported embedder after FastEmbed was removed. Field retained for
# user-config back-compat.
provider = "ollama"
# MUST equal the vector width the model above actually returns. Qdrant
# collections are created with this size at the first index, so a mismatch
# corrupts an index rather than failing cleanly. Verify with:
#   curl -s localhost:11434/api/embed \
#     -d '{"model":"qwen3-embedding:latest","input":"x"}' \
#     | jq '.embeddings[0] | length'
# qwen3-embedding:latest returns 4096 (Ollama `/api/tags` reports the same as
# that tag's `details.embedding_length`). The 4b tag is 2560, the 0.6b is 1024
# — change both fields together if you pull a different one.
dim = 4096
batch_size = 64
keep_alive = "30m"

[reranker]
model = "dengcao/Qwen3-Reranker-4B:Q8_0"
# Deprecated and ignored at runtime — reranker was removed.
enabled = false
top_k = 5

[qdrant]
# "server"   — connect to the Qdrant at `url` and manage nothing. Pair with
#              the Docker container: `rag qdrant-up` starts/reuses `rag-qdrant`
#              (image qdrant/qdrant:v1.18.2, storage ~/.rag/qdrant_server)
#              bound to the port in `url`.
# "embedded" — the daemon hosts Qdrant itself, no Docker: it downloads a
#              pinned qdrant binary to ~/.rag/bin/qdrant on first use, runs it
#              as a child process on the `url` port with server-format storage
#              at ~/.rag/qdrant_server, and stops it with the daemon. If the
#              port already answers, the running instance is reused.
mode = "server"
url = "http://127.0.0.1:6333"
# Legacy Python local-mode store location (pre-2026-07 embedded format).
# The Rust daemon never reads it; kept for rollback tooling only.
path = "~/.rag/qdrant_data"
code_collection = "code_chunks"
# Read only by `/status` when it lists collections. The doc-indexing write path
# takes its collection from the request body and falls back to the literal
# "doc_chunks", so renaming this does not move where docs are written.
docs_collection = "doc_chunks"

[index]
max_chunk_chars = 8000
# Parsed and range-checked but never read at runtime: the effective top_k comes
# from the request body or the planner's SearchPlan, never from this value.
retrieval_top_k = 20
skip_dirs = [".git", "node_modules", ".venv", "venv", "__pycache__", "build", "dist", ".tox", ".mypy_cache", ".ruff_cache"]

[llm]
ollama_url = "http://localhost:11434"
agent_model = "qwen3:8b"
# Generation model for /ask (RAG answer synthesis). Falls back to agent_model.
# gen_model = "qwen3:8b"

# Parsed and range-checked, but the whole section is inert: this build has no
# index-time LSP enrichment. `crates/rag-index/src/lsp.rs` exposes only
# `detect_lsp_servers`, a PATH probe that feeds the dashboards' LSP card.
# Installing a language server changes that display and nothing else. Kept for
# forward compatibility and user-config back-compat.
[lsp]
enabled = true
auto_detect = true
timeout = 5000

[retrieval_agent]
# LLM provider for the search-strategy planner. The daemon wires exactly three:
#   "agy"    — shells out to the Antigravity CLI (subscription auth, no API
#              key, no Gemini public-API 503s).
#   "codex"  — shells out to `codex exec` with subscription authentication,
#              an ephemeral session, and a read-only sandbox.
#   "ollama" — plans through the local Ollama daemon at `llm.ollama_url`, using
#              `model` below as the chat tag (e.g. "qwen3:8b").
# The agy and codex providers also power /smart-search symbol inference.
# "gemini", "openai" and "anthropic" pass config validation and have adapters
# in rag-agent, but the daemon's `plan_query` never constructs them: selecting
# one silently plans with the deterministic heuristic instead. Do not rely on
# them as a fallback.
provider = "agy"
# For agy: a CLI display-name model (see `agy models`). "High" reasoning infers
# real symbol names more reliably (fewer hallucinations) at higher latency;
# "Low" is faster and fine for plain query planning.
# For codex: an OpenAI model id, e.g. "gpt-5.6-luna".
# For ollama: an Ollama chat tag, e.g. "qwen3:8b".
model = "Gemini 3.5 Flash (High)"
# Parsed but never read: it would only matter for the gemini/openai/anthropic
# providers, which the daemon does not wire.
api_key_env = "GEMINI_API_KEY"
# Parsed but never read. The ollama planner talks to `llm.ollama_url`, not to
# this value.
base_url = ""
