[package]
name = "rag-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Pure passthrough to rag-agent's optional `rig` dependency. Enabling it
# compiles the cloud provider adapters into the library but changes no
# behaviour: `plan_query` in retrieval.rs dispatches on "ollama", "agy" and
# "codex" only, and every other provider name falls through to `fallback_plan`.
# Wiring a rig provider in means adding an arm there as well.
cloud-planners = ["rag-agent/cloud-planners"]

[dependencies]
axum.workspace = true
http.workspace = true
rag-config = { path = "../rag-config" }
rag-contracts = { path = "../rag-contracts" }
rag-agent = { path = "../rag-agent" }
rag-index = { path = "../rag-index" }
rag-retrieval = { path = "../rag-retrieval" }
rag-services = { path = "../rag-services" }
rag-storage = { path = "../rag-storage" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1"
regex = "1.11"
reqwest.workspace = true
sha2 = "0.10"
tar = "0.4"
uuid = { version = "1", features = ["v4", "v5"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tower.workspace = true
tempfile = "3.20"

[lints]
workspace = true
