[package]
name = "rag-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "rag-rs"
path = "src/main.rs"

[features]
default = []
# Passthrough so the escape hatch is reachable from the binary:
#   cargo build --release -p rag-app --features cloud-planners
# Without this, `--features rag-agent/cloud-planners` is rejected whenever the
# build is scoped with `-p rag-app`. The shipped build does not enable it; see
# crates/rag-agent/Cargo.toml for why.
cloud-planners = ["rag-server/cloud-planners"]

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap.workspace = true
crossterm.workspace = true
rag-config = { path = "../rag-config" }
rag-server = { path = "../rag-server" }
rag-storage = { path = "../rag-storage" }
ratatui.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile = "3.20"

[lints]
workspace = true
